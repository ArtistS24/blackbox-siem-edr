INSTALL_DIR="/opt/blackbox-edr"
LOG_DIR="/var/log/blackbox-edr"

ENDPOINT_LOG="$LOG_DIR/telemetry.log"
ALERT_LOG="$LOG_DIR/alerts.log"

RULES_FILE="$INSTALL_DIR/configs/rules.json"
POLICIES_FILE="$INSTALL_DIR/configs/policies.json"
FIREWALL_FILE="$INSTALL_DIR/configs/firewall.json"

HOST_ID=$(hostname)
AGENT_ID_FILE="/var/lib/blackbox-edr/agent_id"

RUN_USER="${SUDO_USER:-$USER}"

WATCH_DIRS="/tmp /home /var/www /opt"

FILE_MONITOR_INTERVAL=0.5

MAX_HASH_SIZE_MB=10

HASH_EXTENSIONS="sh py elf bin so jar exe run"

PROCESS_MONITOR_INTERVAL=2

FILE_EVENT_TTL=2
FILE_HASH_TTL=300
PROCESS_HASH_TTL=600

NETWORK_EVENT_TTL=30

SIEM_IP="127.0.0.1"
SIEM_PORT="9000"
SIEM_WEB_PORT="9100"
